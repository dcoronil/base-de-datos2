services:
  web:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      - db
      - redis
      - mongo
      - neo4j

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: campus_auth
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: "neo4j/neo4j_password"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  mongodata:
  neo4jdata:
